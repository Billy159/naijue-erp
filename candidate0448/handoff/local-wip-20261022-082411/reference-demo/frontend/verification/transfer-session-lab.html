<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>调拨隔离模拟会话验证台</title><style>body{font:14px Arial,"PingFang SC";max-width:880px;margin:40px auto;color:#26332c}button,a,input{font:inherit;padding:8px;margin:6px}fieldset{margin:20px 0;border:1px solid #ccd5d0}pre{white-space:pre-wrap;background:#f3f5f4;padding:16px}</style><h1>调拨隔离模拟会话验证台</h1><p>仅用于前端验收；不是真实登录、后台或生产并发服务。账号选择只在此隔离验证入口出现。</p><label>隔离数据空间 <input id="space" value="reliability-qa"></label><fieldset><legend>独立会话，共用同一模拟数据源</legend><a id="a" target="_blank">打开 A · 张三</a><a id="b" target="_blank">打开 B · 李四</a><a id="a2" target="_blank">再开 A 的另一个标签页</a></fieldset><fieldset><legend>故障注入，仅测试使用</legend><button data-action="expire">使 A 当前租约过期</button><button data-action="logout">使 A 会话失效</button><button data-action="inspect">查看共享权威结果</button></fieldset><pre id="result">请选择测试动作。此页面不提供强制覆盖或提交旧草稿入口。</pre><script>
const space=document.querySelector('#space'),result=document.querySelector('#result');function links(){for(const [id,account]of [['a','A'],['b','B'],['a2','A']])document.getElementById(id).href='../?mock-account='+account+'&tr-space='+encodeURIComponent(space.value)+'#transfer'}space.oninput=links;links();document.addEventListener('click',async e=>{const action=e.target.dataset.action;if(!action)return;if(space.value.trim()==='normal'||!space.value.trim()){result.textContent='请使用隔离测试空间，不能操作正常演示入口。';return}const key='erp-transfer-mock-v1:'+space.value;await navigator.locks.request(key,()=>{const s=JSON.parse(localStorage.getItem(key)||'null');if(!s){result.textContent='该隔离数据空间尚未打开。';return}if(action==='expire')for(const l of Object.values(s.leases))if(l.actor.id==='mock-A')l.expires=0;if(action==='logout')for(const x of Object.values(s.sessions))if(x.accountId==='mock-A')x.expires=0;if(action!=='inspect')localStorage.setItem(key,JSON.stringify(s));result.textContent=JSON.stringify({action,documents:s.docs.map(d=>({id:d.id,revision:d.revision,version:d.version,status:d.status,creator:d.creator,modifier:d.modifierActor,q:d.q,history:d.history})),inventoryEvents:s.events.length},null,2)})});
</script></html>
