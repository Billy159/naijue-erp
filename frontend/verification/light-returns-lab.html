<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原单轻量退换 · 验收入口</title><link rel="stylesheet" href="../ui-tokens.css"><style>body{font:15px system-ui;background:var(--bg);color:var(--text);max-width:1080px;margin:32px auto;padding:0 20px}button,a{font:inherit;color:var(--primary)}button{padding:10px 16px;background:white;border:1px solid var(--border);border-radius:4px;cursor:pointer}section{padding:16px 0;border-bottom:1px solid var(--border)}nav{display:flex;gap:24px;flex-wrap:wrap}article{display:flex;gap:12px;align-items:center;margin:12px 0}#error{color:#a32626}</style><h1>原销货单内办理轻量退换</h1><p>从原销售点击“退换”，填写本次退回；换货时在下方录入换出商品。更正与真实退换分别保留。</p><nav><a href="../#sales">正常销货单列表</a><a href="../#sales/new">正常新增销货</a><a href="../#sales-returns">正常退换记录中心</a><a href="light-returns-evidence/index.html">截图与验证记录</a></nav><h2>浏览器实录实例</h2><p>以下实例来自本轮真实浏览器录入。点击后仅在独立验收空间首次载入；已存在的空间不会覆盖。正常空间及此前8767数据不改变。</p><div id="examples"></div><p id="error" role="alert"></p><script>
(async()=>{const groups=await(await fetch('light-returns-evidence/examples.json')).json(),labels={'cross-warehouse':'部分退货／跨仓：原2件600，温州退1，净300','same-size':'同价换码：M退回、L换出，差额0',higher:'换贵商品：300换350，应补50',lower:'换便宜商品：350换300，应退50',multiple:'多次部分退：5件依次退1、2、2，保留原销售5件',correction:'录错更正对比：2更正为1，不产生退货记录',reload:'未完成退换刷新恢复后确认', 'different-actor':'原营业员张三，李四办理退货',gift:'赠品单独退：退衣服不自动退袜子','atomic-retry':'失败保留填写；重试及重放只生效一次'};for(const g of groups){const section=document.createElement('section');for(const x of g.examples){const article=document.createElement('article'),b=document.createElement('button');b.textContent=labels[x.kind]||x.kind;b.onclick=async()=>{try{b.disabled=true;const k='erp-transfer-mock-v1:'+g.space;if(!localStorage.getItem(k)){const response=await fetch('light-returns-evidence/'+g.file);if(!response.ok)throw Error('实例文件读取失败');const state=await response.json();if(!state.salesDocs?.some(d=>d.id===x.id))throw Error('实例原单缺失');localStorage.setItem(k,JSON.stringify(state))}location.href='../?tr-space='+encodeURIComponent(g.space)+(g.fixture?'&sale-fixtures=1':'')+(x.kind==='different-actor'?'&mock-account=B':'')+'#sales/doc/'+encodeURIComponent(x.id)}catch(e){document.querySelector('#error').textContent='无法载入实例：'+e.message;b.disabled=false}};article.append(b);section.append(article)}document.querySelector('#examples').append(section)}})().catch(e=>document.querySelector('#error').textContent=e.message);
</script></html>
